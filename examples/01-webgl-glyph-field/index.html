<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebGL 微字形流场与环境弥散光场</title>
  <style>
    :root {
      --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
      --ease-snappy: cubic-bezier(0.16, 1, 0.3, 1);
      --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);

      --bg-page: #f8f8f8;
      --aura-1: rgba(220, 232, 223, 0.68);
      --aura-2: rgba(139, 187, 172, 0.38);
      --aura-3: rgba(184, 201, 196, 0.40);
      --aura-4: rgba(79, 140, 121, 0.28);

      --panel-bg: rgba(255, 255, 255, 0.82);
      --panel-border: rgba(0, 0, 0, 0.08);
      --panel-text: #141414;
      --panel-muted: #6e6e73;
      --panel-subtle: rgba(0, 0, 0, 0.045);
      --panel-shadow: 0 20px 44px -10px rgba(0, 0, 0, 0.10), 0 2px 10px rgba(0, 0, 0, 0.04), 0 0 0 1px rgba(0, 0, 0, 0.06);
    }

    [data-ui-dark="true"] {
      --panel-bg: rgba(24, 24, 28, 0.84);
      --panel-border: rgba(255, 255, 255, 0.10);
      --panel-text: #f4f4f6;
      --panel-muted: #9ca3af;
      --panel-subtle: rgba(255, 255, 255, 0.07);
      --panel-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.10);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", "PingFang SC", -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--panel-text);
      user-select: none;
      transition: background-color 360ms var(--ease-standard);
    }

    /* 全屏 WebGL 微字形流场画布容器 + 环境弥散光场 */
    .treg-field-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      isolation: isolate;
      overflow: hidden;
    }

    .treg-field-stage::before {
      content: "";
      position: absolute;
      inset: -8%;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 50% 22%, var(--aura-1), transparent 62%),
        radial-gradient(ellipse at 35% 62%, var(--aura-2), transparent 58%),
        radial-gradient(ellipse at 66% 54%, var(--aura-3), transparent 60%),
        radial-gradient(ellipse at 54% 78%, var(--aura-4), transparent 56%);
      filter: blur(36px);
      animation: gatewayAura 16s ease-in-out infinite alternate;
      transition: opacity 360ms var(--ease-standard);
    }

    @keyframes gatewayAura {
      from { transform: translate3d(-14px, 8px, 0) scale(0.98); }
      to   { transform: translate3d(14px, -8px, 0) scale(1.03); }
    }

    .hero-particles {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      contain: strict;
    }

    /* ================= 悬浮色彩控制面板 ================= */
    .palette-widget {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 100;
      width: 288px;
      border-radius: 20px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--panel-shadow);
      padding: 16px;
      transition:
        transform 340ms var(--ease-spring),
        opacity 240ms var(--ease-standard),
        background-color 280ms var(--ease-standard),
        box-shadow 280ms var(--ease-standard);
    }

    .palette-widget.is-collapsed {
      width: auto;
      padding: 8px 12px;
      border-radius: 999px;
    }

    .palette-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
    }

    .palette-widget.is-collapsed .palette-header {
      margin-bottom: 0;
    }

    .palette-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .palette-live-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #059659;
      box-shadow: 0 0 0 2px rgba(5, 150, 89, 0.22);
      flex-shrink: 0;
      transition: background-color 240ms var(--ease-standard), box-shadow 240ms var(--ease-standard);
    }

    .palette-title {
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--panel-text);
    }

    .palette-toggle-btn {
      height: 24px;
      padding: 0 8px;
      border-radius: 999px;
      border: none;
      background: var(--panel-subtle);
      color: var(--panel-muted);
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 150ms var(--ease-standard), color 150ms var(--ease-standard), transform 140ms var(--ease-snappy);
    }

    .palette-toggle-btn:hover {
      color: var(--panel-text);
    }

    .palette-toggle-btn:active {
      transform: scale(0.94);
    }

    .palette-body {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .palette-widget.is-collapsed .palette-body {
      display: none;
    }

    /* 预设色卡网格 */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }

    .preset-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      height: 32px;
      padding: 0 9px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: var(--panel-subtle);
      color: var(--panel-text);
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 150ms var(--ease-snappy), border-color 160ms var(--ease-standard), background-color 160ms var(--ease-standard);
    }

    .preset-btn:hover {
      border-color: var(--panel-border);
    }

    .preset-btn:active {
      transform: scale(0.95);
    }

    .preset-btn.is-active {
      border-color: currentColor;
      background: color-mix(in srgb, var(--panel-subtle) 40%, transparent);
    }

    .preset-swatch {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12);
    }

    /* 自定义拾色器行 */
    .custom-pickers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--panel-border);
    }

    .picker-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 9px;
      border-radius: 10px;
      background: var(--panel-subtle);
      cursor: pointer;
      transition: transform 140ms var(--ease-snappy);
    }

    .picker-item:active {
      transform: scale(0.97);
    }

    .picker-label {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--panel-muted);
    }

    .picker-input-wrap {
      position: relative;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    .picker-input {
      position: absolute;
      inset: -6px;
      width: 32px;
      height: 32px;
      border: none;
      padding: 0;
      background: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 100% 全屏纯背景容器 -->
  <div class="treg-field-stage" id="tregFieldStage"></div>

  <!-- 右下角悬浮色彩面板 -->
  <aside class="palette-widget" id="paletteWidget" aria-label="色彩面板">
    <div class="palette-header">
      <div class="palette-title-group">
        <span class="palette-live-dot" id="paletteLiveDot"></span>
        <span class="palette-title">色彩面板</span>
      </div>
      <button type="button" class="palette-toggle-btn" id="collapseBtn" title="收起/展开面板 (快捷键 H)">收起</button>
    </div>

    <div class="palette-body">
      <div class="preset-grid" id="presetGrid">
        <button type="button" class="preset-btn is-active" data-preset="emerald">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #8bbbac, #059659)"></span>
          <span>翡翠绿</span>
        </button>
        <button type="button" class="preset-btn" data-preset="ocean">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #7dd3fc, #0284c7)"></span>
          <span>冰川蓝</span>
        </button>
        <button type="button" class="preset-btn" data-preset="violet">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #c4b5fd, #7c3aed)"></span>
          <span>极光紫</span>
        </button>
        <button type="button" class="preset-btn" data-preset="amber">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #fde68a, #ea580c)"></span>
          <span>落日金</span>
        </button>
        <button type="button" class="preset-btn" data-preset="sakura">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #fbcfe8, #e11d48)"></span>
          <span>雾樱粉</span>
        </button>
        <button type="button" class="preset-btn" data-preset="obsidian">
          <span class="preset-swatch" style="background: linear-gradient(135deg, #27272a, #e4e4e7)"></span>
          <span>黑曜石</span>
        </button>
      </div>

      <div class="custom-pickers">
        <label class="picker-item" title="自定义背景底色">
          <span class="picker-label">背景底色</span>
          <span class="picker-input-wrap">
            <input type="color" class="picker-input" id="pickBg" value="#f8f8f8" />
          </span>
        </label>
        <label class="picker-item" title="自定义环境弥散光晕主色">
          <span class="picker-label">弥散光晕</span>
          <span class="picker-input-wrap">
            <input type="color" class="picker-input" id="pickAura" value="#7fb8a4" />
          </span>
        </label>
        <label class="picker-item" title="自定义微字形静默态颜色">
          <span class="picker-label">字形粒子</span>
          <span class="picker-input-wrap">
            <input type="color" class="picker-input" id="pickBase" value="#306657" />
          </span>
        </label>
        <label class="picker-item" title="自定义光标轨迹与波纹高亮色">
          <span class="picker-label">轨迹高亮</span>
          <span class="picker-input-wrap">
            <input type="color" class="picker-input" id="pickHeat" value="#059659" />
          </span>
        </label>
      </div>
    </div>
  </aside>

  <script>
    // HEX <-> RGB [0..1] 辅助函数
    function hexToRgb01(hex) {
      const clean = hex.replace('#', '');
      const num = parseInt(clean.length === 3 ? clean.split('').map((c) => c + c).join('') : clean, 16);
      return [((num >> 16) & 255) / 255, ((num >> 8) & 255) / 255, (num & 255) / 255];
    }

    function hexToRgbaCss(hex, alpha) {
      const [r, g, b] = hexToRgb01(hex).map((v) => Math.round(v * 255));
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function isDarkHex(hex) {
      const [r, g, b] = hexToRgb01(hex);
      return (0.299 * r + 0.587 * g + 0.114 * b) < 0.42;
    }

    // 6 套精选配色预设
    const COLOR_PRESETS = {
      emerald: {
        bg: '#f8f8f8',
        aura: '#7fb8a4',
        auras: [
          'rgba(220, 232, 223, 0.68)',
          'rgba(139, 187, 172, 0.38)',
          'rgba(184, 201, 196, 0.40)',
          'rgba(79, 140, 121, 0.28)'
        ],
        base: '#306657',
        heat: '#059659'
      },
      ocean: {
        bg: '#f6f9fc',
        aura: '#60a5fa',
        auras: [
          'rgba(219, 234, 254, 0.72)',
          'rgba(125, 211, 252, 0.38)',
          'rgba(186, 230, 253, 0.42)',
          'rgba(56, 189, 248, 0.26)'
        ],
        base: '#2b547e',
        heat: '#0284c7'
      },
      violet: {
        bg: '#f8f7fc',
        aura: '#a78bfa',
        auras: [
          'rgba(237, 233, 254, 0.72)',
          'rgba(196, 181, 253, 0.40)',
          'rgba(221, 214, 254, 0.42)',
          'rgba(139, 92, 246, 0.24)'
        ],
        base: '#4c3b78',
        heat: '#7c3aed'
      },
      amber: {
        bg: '#fbf9f5',
        aura: '#fb923c',
        auras: [
          'rgba(254, 243, 199, 0.72)',
          'rgba(253, 186, 116, 0.38)',
          'rgba(254, 215, 170, 0.42)',
          'rgba(249, 115, 22, 0.24)'
        ],
        base: '#78492a',
        heat: '#ea580c'
      },
      sakura: {
        bg: '#fcf8fa',
        aura: '#f472b6',
        auras: [
          'rgba(252, 231, 243, 0.72)',
          'rgba(249, 168, 212, 0.38)',
          'rgba(251, 207, 232, 0.42)',
          'rgba(244, 63, 94, 0.22)'
        ],
        base: '#7a3b58',
        heat: '#e11d48'
      },
      obsidian: {
        bg: '#111113',
        aura: '#27272a',
        auras: [
          'rgba(39, 39, 42, 0.45)',
          'rgba(63, 63, 70, 0.22)',
          'rgba(39, 39, 42, 0.25)',
          'rgba(82, 82, 91, 0.16)'
        ],
        base: '#85858a',
        heat: '#f4f4f6'
      }
    };

    // 当前与目标着色器 RGB 向量（支持平滑插值过渡）
    let currentBaseRgb = hexToRgb01(COLOR_PRESETS.emerald.base);
    let targetBaseRgb = [...currentBaseRgb];
    let currentHeatRgb = hexToRgb01(COLOR_PRESETS.emerald.heat);
    let targetHeatRgb = [...currentHeatRgb];

    (function initTregGlyphField() {
      const host = document.getElementById('tregFieldStage');
      if (!host) return;
      const canvas = document.createElement('canvas');
      canvas.className = 'hero-particles';
      canvas.setAttribute('aria-hidden', 'true');
      host.prepend(canvas);

      const gl = canvas.getContext('webgl', {
        alpha: true,
        antialias: false,
        depth: false,
        stencil: false,
        premultipliedAlpha: true,
        powerPreference: 'low-power'
      });
      if (!gl) {
        canvas.remove();
        return;
      }

      const vertex = `
        precision highp float;
        attribute vec3 aPoint;
        uniform vec2 uSize, uDrift;
        uniform float uTime, uDpr, uCell;
        uniform vec3 uOpening;
        uniform vec3 uTrail[24];
        uniform vec4 uTextAreas[8];
        varying float vAlpha, vKind, vHeat;

        float segment(vec2 p, vec2 a, vec2 b) {
          vec2 ab = b - a;
          float t = clamp(dot(p - a, ab) / max(dot(ab, ab), 0.001), 0.0, 1.0);
          return length(p - a - t * ab);
        }

        void main() {
          vec2 p = aPoint.xy + uDrift;
          float ripple = 0.0, reveal = 1.0;
          if (uOpening.z >= 0.0) {
            vec2 radial = p - uOpening.xy * uSize;
            float distance = length(radial);
            float speed = length(uSize) * 0.17;
            float radius = max(0.0, uOpening.z - 0.12) * speed;
            float ring = exp(-pow((distance - radius) / 70.0, 2.0));
            ripple = ring * (1.0 - smoothstep(3.8, 5.7, uOpening.z));
            reveal = mix(1.0 - smoothstep(radius - 110.0, radius + 110.0, distance), 1.0, smoothstep(3.6, 5.3, uOpening.z));
            p += radial / max(distance, 1.0) * ripple * 4.0;
          }

          float w = 0.5 + 0.30 * sin(p.x * 0.010 + p.y * 0.009 - uTime * 0.65) + 0.20 * sin(p.x * -0.006 + p.y * 0.013 - uTime * 0.43);
          float heat = 0.0;
          for (int i = 0; i < 23; i++) {
            float life = min(uTrail[i].z, uTrail[i + 1].z);
            float d = segment(p, uTrail[i].xy, uTrail[i + 1].xy);
            if (life > 0.0 && d < 4.5) heat = 1.0;
          }

          vAlpha = ((0.045 + 0.26 * pow(w, 1.65)) * reveal + ripple * 0.08) * step(0.10, aPoint.z);
          vHeat = max(heat, min(1.0, ripple * 0.14)) * step(0.10, aPoint.z);
          vKind = mod(floor(aPoint.z * 31.0), 3.0);

          float readability = 1.0;
          for (int i = 0; i < 8; i++) {
            vec4 area = uTextAreas[i];
            if (area.z > 0.0) {
              vec2 outside = max(abs(p - area.xy) - area.zw, vec2(0.0));
              float cover = 1.0 - smoothstep(0.0, 88.0, length(outside));
              readability = min(readability, 1.0 - cover * 0.85);
            }
          }
          vAlpha *= readability;
          vHeat *= readability;

          gl_Position = vec4(p.x / uSize.x * 2.0 - 1.0, 1.0 - p.y / uSize.y * 2.0, 0.0, 1.0);
          gl_PointSize = (min(uCell * 0.82, 5.0) + ripple * 0.35) * uDpr;
        }
      `;

      const fragment = `
        precision mediump float;
        uniform vec3 uBaseCol, uHeatCol;
        varying float vAlpha, vKind, vHeat;

        float box(vec2 p, vec2 c, float r) {
          return 1.0 - smoothstep(r - 0.045, r + 0.045, max(abs(p.x - c.x), abs(p.y - c.y)));
        }

        void main() {
          vec2 p = gl_PointCoord - 0.5;
          float d = length(p);
          float glyph;
          if (vKind < 0.5) glyph = 1.0 - smoothstep(0.17, 0.23, d);
          else if (vKind < 1.5) glyph = (1.0 - smoothstep(0.35, 0.42, d)) * smoothstep(0.12, 0.19, d);
          else glyph = max(box(p, vec2(-0.12, -0.12), 0.20), box(p, vec2(0.12, 0.12), 0.20));

          float a = glyph * mix(vAlpha, 0.66, vHeat);
          vec3 col = mix(uBaseCol, uHeatCol, vHeat);
          gl_FragColor = vec4(col * a, a);
        }
      `;

      function compileShader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          gl.deleteShader(s);
          throw new Error('Shader compile failed');
        }
        return s;
      }

      let program, buffer;
      try {
        const vs = compileShader(gl.VERTEX_SHADER, vertex);
        const fs = compileShader(gl.FRAGMENT_SHADER, fragment);
        program = gl.createProgram();
        gl.attachShader(program, vs);
        gl.attachShader(program, fs);
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error('Program link failed');
      } catch (err) {
        canvas.remove();
        return;
      }

      gl.useProgram(program);
      buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      const attr = gl.getAttribLocation(program, 'aPoint');
      gl.enableVertexAttribArray(attr);
      gl.vertexAttribPointer(attr, 3, gl.FLOAT, false, 0, 0);

      const uniforms = Object.fromEntries(
        ['uSize', 'uDrift', 'uTime', 'uDpr', 'uCell', 'uOpening', 'uBaseCol', 'uHeatCol', 'uTrail[0]', 'uTextAreas[0]'].map((n) => [
          n,
          gl.getUniformLocation(program, n)
        ])
      );
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);

      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
      const coarse = window.matchMedia('(pointer: coarse)');
      let width = 1, height = 1, count = 0, dpr = 1, cell = 7;
      let dx = 0, dy = 0, tx = 0, ty = 0;
      let trail = [];
      const packedTrail = new Float32Array(72);
      const textAreas = new Float32Array(32);
      let textDirty = true;
      let openingStart = performance.now();
      let openingX = 0.5, openingY = 0.5;
      let lastTime = 0, simTime = 0;

      function measureTextAreas() {
        textAreas.fill(0);
        textDirty = false;
        const origin = host.getBoundingClientRect();
        const nodes = Array.from(host.querySelectorAll('[data-quiet-zone]')).slice(0, 8);
        nodes.forEach((node, i) => {
          const r = node.getBoundingClientRect();
          if (!r.width || !r.height) return;
          textAreas.set(
            [
              r.left - origin.left + r.width / 2,
              r.top - origin.top + r.height / 2,
              r.width / 2 + 10,
              r.height / 2 + 8
            ],
            i * 4
          );
        });
      }

      function resizeField() {
        textDirty = true;
        width = Math.max(1, host.clientWidth);
        height = Math.max(1, host.clientHeight);
        dpr = Math.min(window.devicePixelRatio || 1, 1.35);
        cell = Math.max(coarse.matches ? 8 : 6, Math.sqrt((width * height) / 75000));
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        gl.viewport(0, 0, canvas.width, canvas.height);

        const points = [];
        let seed = 71;
        for (let y = -cell; y < height + cell; y += cell) {
          for (let x = -cell; x < width + cell; x += cell) {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            points.push(x, y, seed / 4294967296);
          }
        }
        count = points.length / 3;
        gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(points), gl.STATIC_DRAW);
      }

      window.addEventListener('pointermove', (e) => {
        if (reduced.matches || e.pointerType === 'touch') return;
        const r = host.getBoundingClientRect();
        const x = e.clientX - r.left;
        const y = e.clientY - r.top;
        if (y < -40 || y > height + 40) return;
        tx = (x / width - 0.5) * -16;
        ty = (y / height - 0.5) * -12;
        const now = performance.now();
        const prev = trail[trail.length - 1];
        if (!prev || Math.hypot(x - prev.x, y - prev.y) > 4 || now - prev.t > 40) {
          trail.push({ x, y, t: now });
          if (trail.length > 24) trail.shift();
        }
      }, { passive: true });

      host.addEventListener('pointerleave', () => {
        tx = 0;
        ty = 0;
      });

      host.addEventListener('click', (e) => {
        if (window.tregParticles) window.tregParticles.pulseFromEvent(e);
      });

      new ResizeObserver(resizeField).observe(host);
      resizeField();

      function tickField(now) {
        if (!document.hidden) {
          if (textDirty) measureTextAreas();
          const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0;
          lastTime = now;
          if (!reduced.matches) simTime += dt;

          const ease = 1 - Math.exp(-dt * 7);
          dx += (tx - dx) * ease;
          dy += (ty - dy) * ease;

          // 颜色平滑插值过渡
          const colorLerp = 1 - Math.exp(-dt * 10);
          for (let c = 0; c < 3; c++) {
            currentBaseRgb[c] += (targetBaseRgb[c] - currentBaseRgb[c]) * colorLerp;
            currentHeatRgb[c] += (targetHeatRgb[c] - currentHeatRgb[c]) * colorLerp;
          }

          const lifetime = 550;
          packedTrail.fill(0);
          trail = trail.filter((p) => now - p.t < lifetime);
          for (let i = 0; i < trail.length; i++) {
            packedTrail[i * 3] = trail[i].x;
            packedTrail[i * 3 + 1] = trail[i].y;
            packedTrail[i * 3 + 2] = 1 - (now - trail[i].t) / lifetime;
          }

          const openingElapsed = openingStart >= 0 ? (now - openingStart) / 1000 : -1;

          gl.uniform2f(uniforms.uSize, width, height);
          gl.uniform2f(uniforms.uDrift, dx, dy);
          gl.uniform1f(uniforms.uTime, simTime);
          gl.uniform1f(uniforms.uDpr, dpr);
          gl.uniform1f(uniforms.uCell, cell);
          gl.uniform3f(uniforms.uBaseCol, currentBaseRgb[0], currentBaseRgb[1], currentBaseRgb[2]);
          gl.uniform3f(uniforms.uHeatCol, currentHeatRgb[0], currentHeatRgb[1], currentHeatRgb[2]);
          gl.uniform3f(uniforms.uOpening, openingX, openingY, openingElapsed < 6.0 ? openingElapsed : -1);
          gl.uniform3fv(uniforms['uTrail[0]'], packedTrail);
          gl.uniform4fv(uniforms['uTextAreas[0]'], textAreas);

          gl.clearColor(0, 0, 0, 0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.drawArrays(gl.POINTS, 0, count);
        }
        requestAnimationFrame(tickField);
      }
      requestAnimationFrame(tickField);

      window.tregParticles = {
        pulseFromEvent(e) {
          const r = host.getBoundingClientRect();
          openingX = e && e.clientX ? (e.clientX - r.left) / width : 0.5;
          openingY = e && e.clientY ? (e.clientY - r.top) / height : 0.5;
          openingStart = performance.now();
        },
        invalidateText() {
          textDirty = true;
        }
      };
    })();

    // ================= 色彩面板交互控制 =================
    const rootStyle = document.documentElement.style;
    const paletteWidget = document.getElementById('paletteWidget');
    const collapseBtn = document.getElementById('collapseBtn');
    const paletteLiveDot = document.getElementById('paletteLiveDot');
    const presetGrid = document.getElementById('presetGrid');
    const pickBg = document.getElementById('pickBg');
    const pickAura = document.getElementById('pickAura');
    const pickBase = document.getElementById('pickBase');
    const pickHeat = document.getElementById('pickHeat');

    function updateLiveDot(heatHex) {
      paletteLiveDot.style.backgroundColor = heatHex;
      paletteLiveDot.style.boxShadow = `0 0 0 3px ${hexToRgbaCss(heatHex, 0.22)}`;
    }

    function applyBgColor(bgHex) {
      rootStyle.setProperty('--bg-page', bgHex);
      document.documentElement.setAttribute('data-ui-dark', isDarkHex(bgHex) ? 'true' : 'false');
    }

    function applyAuraColor(auraHex, customAuras = null) {
      if (customAuras) {
        rootStyle.setProperty('--aura-1', customAuras[0]);
        rootStyle.setProperty('--aura-2', customAuras[1]);
        rootStyle.setProperty('--aura-3', customAuras[2]);
        rootStyle.setProperty('--aura-4', customAuras[3]);
      } else {
        rootStyle.setProperty('--aura-1', hexToRgbaCss(auraHex, 0.52));
        rootStyle.setProperty('--aura-2', hexToRgbaCss(auraHex, 0.36));
        rootStyle.setProperty('--aura-3', hexToRgbaCss(auraHex, 0.38));
        rootStyle.setProperty('--aura-4', hexToRgbaCss(auraHex, 0.25));
      }
    }

    function applyPreset(name, triggerEvent = null) {
      const p = COLOR_PRESETS[name];
      if (!p) return;

      pickBg.value = p.bg;
      pickAura.value = p.aura;
      pickBase.value = p.base;
      pickHeat.value = p.heat;

      applyBgColor(p.bg);
      applyAuraColor(p.aura, p.auras);
      targetBaseRgb = hexToRgb01(p.base);
      targetHeatRgb = hexToRgb01(p.heat);
      updateLiveDot(p.heat);

      presetGrid.querySelectorAll('.preset-btn').forEach((btn) => {
        btn.classList.toggle('is-active', btn.dataset.preset === name);
      });

      if (window.tregParticles) {
        window.tregParticles.pulseFromEvent(triggerEvent);
      }
    }

    presetGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.preset-btn');
      if (!btn) return;
      applyPreset(btn.dataset.preset, e);
    });

    function clearActivePreset() {
      presetGrid.querySelectorAll('.preset-btn').forEach((btn) => btn.classList.remove('is-active'));
    }

    pickBg.addEventListener('input', (e) => {
      clearActivePreset();
      applyBgColor(e.target.value);
    });

    pickAura.addEventListener('input', (e) => {
      clearActivePreset();
      applyAuraColor(e.target.value);
    });

    pickBase.addEventListener('input', (e) => {
      clearActivePreset();
      targetBaseRgb = hexToRgb01(e.target.value);
    });

    pickHeat.addEventListener('input', (e) => {
      clearActivePreset();
      targetHeatRgb = hexToRgb01(e.target.value);
      updateLiveDot(e.target.value);
    });

    function toggleCollapse() {
      const isCollapsed = paletteWidget.classList.toggle('is-collapsed');
      collapseBtn.textContent = isCollapsed ? '展开' : '收起';
    }

    collapseBtn.addEventListener('click', toggleCollapse);
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H') toggleCollapse();
    });
  </script>
</body>
</html>
